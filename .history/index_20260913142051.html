<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Pragathi Ilango | UI/UX Designer & Web Developer</title>

  <!-- Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="styles.css">
</head>

<body>

  <!-- HEADER -->
  <header class="site-header">

    <a
      class="site-logo-link"
      href="#top"
      aria-label="Pragathi Ilango home"
    >
      <img
        class="site-logo"
        src="assets/images/pi_logo.svg"
        alt="Pragathi Ilango"
      >
    </a>

    <nav class="main-nav" aria-label="Primary navigation">
      <a href="#about">About</a>
      <a href="#playground">Playground</a>
      <a
        href="resume.pdf"
        target="_blank"
        rel="noopener"
      >
        Resume
      </a>
    </nav>

  </header>


  <main id="top">

    <!-- HERO -->
    <section
      class="hero"
      aria-labelledby="hero-title"
    >

      <div class="hero-stage">

        <h1
          id="hero-title"
          class="hero-title"
          aria-label="UI UX Designer Web Developer"
        >

          <!-- FIRST LINE -->
          <span class="hero-line hero-line-top">
            UI UX
            <span class="slant-letter">D</span>ESIGNER
          </span>

          <!-- SECOND LINE -->
          <span class="hero-line hero-line-bottom">
            WEB DEVELO<span class="slant-letter">P</span>ER
          </span>

        </h1>


        <!-- CENTER ILLUSTRATION -->
        <img
          class="hero-portrait"
          src="assets/images/pragathi-icon.png"
          alt=""
          aria-hidden="true"
        >

      </div>


      <!-- BOTTOM NAME ROW -->
      <div
        class="hero-name-row"
        aria-label="Pragathi Ilango"
      >
        <span>Pragathi</span>
        <span>Ilango</span>
      </div>

    </section>

    <!-- NEXT SECTION WILL GO HERE -->

  </main>


  <script src="script.js"></script>

</body>

</html>
